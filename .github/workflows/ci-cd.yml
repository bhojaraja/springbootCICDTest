name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean install

    - name: Run tests
      run: mvn test

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Kill existing application
      run: |
        pid=$(lsof -ti :8085)
        if [ ! -z "$pid" ]; then
          echo "Killing existing application on port 8085 (PID: $pid)"
          kill -9 $pid
        else
          echo "No application running on port 8085"
        fi
      continue-on-error: true

    - name: Run Spring Boot application
      run: |
        nohup mvn spring-boot:run > app.log 2>&1 &
        echo $! > app.pid
        sleep 10
        echo "Application started with PID: $(cat app.pid)"

    - name: Verify application is running
      run: |
        max_attempts=5
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/hello)
          if [ "$response" = "200" ]; then
            echo "Application is running successfully. Response: $response"
            exit 0
          fi
          echo "Attempt $attempt failed. Response: $response. Retrying..."
          attempt=$((attempt + 1))
          sleep 2
        done
        echo "Application failed to respond after $max_attempts attempts"
        exit 1

    - name: Upload application log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: application-logs
        path: app.log
